<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Big Pickle · Chat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0e0f11;
    --surface:   #16181c;
    --border:    #252830;
    --accent:    #5aff8c;
    --accent-dim:#1e3d2a;
    --text:      #d4d8e0;
    --muted:     #5a6070;
    --user-bg:   #1a1d22;
    --ai-bg:     #141618;
    --radius:    10px;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-sans: 'IBM Plex Sans', sans-serif;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 0;
  }

  /* ── header ── */
  header {
    width: 100%;
    max-width: 720px;
    padding: 24px 0 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .pickle-icon {
    width: 36px; height: 36px;
    background: var(--accent-dim);
    border: 1.5px solid var(--accent);
    border-radius: 8px;
    display: grid; place-items: center;
    font-size: 18px;
  }
  .header-text h1 {
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: .04em;
  }
  .header-text p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 1px;
  }
  .reset-btn {
    margin-left: auto;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── messages ── */
  #chat {
    width: 100%;
    max-width: 720px;
    flex: 1;
    overflow-y: auto;
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .msg {
    display: flex;
    gap: 10px;
    animation: fadeUp .2s ease both;
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(6px); }
    to   { opacity:1; transform: translateY(0);   }
  }

  .avatar {
    width: 28px; height: 28px;
    border-radius: 6px;
    flex-shrink: 0;
    display: grid; place-items: center;
    font-size: 12px;
    font-family: var(--font-mono);
    font-weight: 500;
    margin-top: 2px;
  }
  .msg.user .avatar  { background: #1e2540; color: #7ca0ff; border: 1px solid #2a3560; }
  .msg.ai   .avatar  { background: var(--accent-dim); color: var(--accent); border: 1px solid #2d5040; }

  .bubble {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    line-height: 1.65;
    font-size: 14px;
  }
  .msg.user .bubble { background: var(--user-bg); }
  .msg.ai   .bubble { background: var(--ai-bg);   }

  .bubble code {
    font-family: var(--font-mono);
    background: #0a0b0d;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 13px;
    color: var(--accent);
  }
  .bubble pre {
    background: #0a0b0d;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    overflow-x: auto;
    margin: 10px 0;
  }
  .bubble pre code {
    background: none;
    padding: 0;
    font-size: 13px;
    color: #a8b4c8;
  }

  /* ── thinking indicator ── */
  .thinking .bubble {
    display: flex; align-items: center; gap: 8px;
    color: var(--muted);
    font-size: 13px;
    font-family: var(--font-mono);
  }
  .dots { display:flex; gap:4px; }
  .dots span {
    width:5px; height:5px;
    background: var(--accent);
    border-radius: 50%;
    animation: blink 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay:.2s; }
  .dots span:nth-child(3) { animation-delay:.4s; }
  @keyframes blink {
    0%,80%,100% { opacity:.15; transform:scale(.8); }
    40%         { opacity:1;   transform:scale(1);  }
  }

  /* ── input bar ── */
  #input-area {
    width: 100%;
    max-width: 720px;
    padding: 14px 0 24px;
    border-top: 1px solid var(--border);
  }
  #form {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    padding: 11px 16px;
    resize: none;
    outline: none;
    line-height: 1.5;
    max-height: 140px;
    transition: border-color .15s;
  }
  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: var(--muted); }

  #send {
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: #0a1a10;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    padding: 11px 20px;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity .15s;
  }
  #send:disabled { opacity: .4; cursor: not-allowed; }
  #send:not(:disabled):hover { opacity: .85; }
</style>
</head>
<body>

<header>
  <div class="pickle-icon">🥒</div>
  <div class="header-text">
    <h1>big-pickle</h1>
    <p>opencode.ai/zen · free tier · Ibrahim's session</p>
  </div>
  <button class="reset-btn" onclick="resetChat()">↺ reset</button>
</header>

<div id="chat"></div>

<div id="input-area">
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask anything…"></textarea>
    <button id="send" type="submit">send</button>
  </form>
</div>

<script>
  const chat  = document.getElementById('chat');
  const input = document.getElementById('input');
  const send  = document.getElementById('send');

  // auto-grow textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  // send on Enter (Shift+Enter = newline)
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitForm(); }
  });

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault(); submitForm();
  });

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    const label = role === 'user' ? 'you' : 'ai';
    div.innerHTML = `
      <div class="avatar">${label}</div>
      <div class="bubble">${formatText(text)}</div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addThinking() {
    const div = document.createElement('div');
    div.className = 'msg ai thinking';
    div.innerHTML = `
      <div class="avatar">ai</div>
      <div class="bubble">
        <div class="dots"><span></span><span></span><span></span></div>
        thinking…
      </div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function formatText(text) {
    // code blocks
    text = text.replace(/```(\\w*)\\n?([\\s\\S]*?)```/g,
      (_, lang, code) => `<pre><code>${escHtml(code.trim())}</code></pre>`);
    // inline code
    text = text.replace(/`([^`]+)`/g,
      (_, c) => `<code>${escHtml(c)}</code>`);
    // newlines
    text = text.replace(/\\n/g, '<br>');
    return text;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function submitForm() {
    const q = input.value.trim();
    if (!q) return;

    addMessage('user', escHtml(q));
    input.value = '';
    input.style.height = 'auto';
    send.disabled = true;

    const thinking = addThinking();

    try {
      const res  = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q }),
      });
      const data = await res.json();
      thinking.remove();
      if (data.error) {
        addMessage('ai', '⚠ ' + data.error);
      } else {
        addMessage('ai', data.answer);
      }
    } catch (err) {
      thinking.remove();
      addMessage('ai', '⚠ Network error.');
    }

    send.disabled = false;
    input.focus();
  }

  async function resetChat() {
    await fetch('/reset', { method: 'POST' });
    chat.innerHTML = '';
    addMessage('ai', 'Session reset. Hi Ibrahim, how can I help?');
  }

  // greeting on load
  addMessage('ai', "Hi Ibrahim 👋 — I\\'m Big Pickle. Ask me anything");
</script>
</body>
</html>
